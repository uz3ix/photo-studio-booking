{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Система бронирования фотостудий{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
  {% include "includes/navigation.html" %}
  <main class="container" id="page-top">
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <button class="btn btn-outline-secondary" id="back-to-top" type="button" hidden>Наверх ↑</button>
  </footer>
  <script src="{% static 'homepage/js/main.js' %}" defer></script>
</body>
</html>
